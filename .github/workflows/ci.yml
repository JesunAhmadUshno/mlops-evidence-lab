name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned numerical stack (numpy 2.5.x) requires Python
          # 3.12 or newer, so CI runs the machine-of-record version.
          python-version: "3.12"
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: Fetch the pinned rag subject and build the question set
        run: |
          sh scripts/fetch_rag_subject.sh
          python scripts/build_questions.py
      - name: Unit tests
        run: pytest -q
      - name: Byte-compile all sources
        run: python -m py_compile src/*.py src/ragref/*.py scripts/*.py
