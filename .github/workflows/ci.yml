name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: Fetch the pinned question sources
        run: sh scripts/fetch_rag_subject.sh
      - name: Build the frozen question set
        run: python scripts/build_questions.py
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Compile all study code
        run: python -m py_compile src/*.py src/ragref/*.py scripts/*.py
