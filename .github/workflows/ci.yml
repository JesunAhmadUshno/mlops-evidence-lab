name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The pinned numerical stack (numpy 2.5.x) requires Python 3.12
      # (DECISIONS.md D5), so 3.11 runs only the dependency-free checks
      # (DECISIONS.md D7).
      - name: Install the pinned stack (3.12)
        if: matrix.python-version == '3.12'
        run: python -m pip install -r requirements.txt
      - name: Install pytest only (3.11)
        if: matrix.python-version == '3.11'
        run: python -m pip install pytest==9.2.0
      - name: Layout, lock and no-public-grade checks
        run: python -m pytest tests/test_layout.py -q
      - name: Results regenerate unchanged from the evidence
        run: python scripts/make_results.py && git diff --exit-code RESULTS.md results/verdicts.json
      - name: Byte-compile all sources
        run: python -m py_compile src/*.py src/ragref/*.py scripts/*.py
      - name: Fetch the pinned rag subject and rebuild the question set
        if: matrix.python-version == '3.12'
        run: |
          sh scripts/fetch_rag_subject.sh
          python scripts/build_questions.py
          git diff --exit-code data/questions.json
      - name: Unit tests (3.12)
        if: matrix.python-version == '3.12'
        run: python -m pytest tests -q
